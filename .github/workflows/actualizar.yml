name: Actualizar datos y publicar
on:
  schedule:
    - cron: "17 7 * * *"   # diario a las 07:17 hora de Madrid (todo el año, sigue el cambio de hora)
      timezone: "Europe/Madrid"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Regenerar datos
        if: github.event_name != 'push'
        run: bash scripts/update_all.sh
      - name: Validar (si falla, no se publica)
        run: python3 scripts/validate.py
      - name: Commit si hay cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data site/data.js CHANGELOG.md
          git diff --cached --quiet || (git commit -m "Datos actualizados $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Abrir issue si la validación falla
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$( [ -f data/validacion.md ] && cat data/validacion.md || echo 'Fallo antes de la validación')"
          BODY="$BODY

          Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. No se ha publicado nada."
          gh issue create --repo "${{ github.repository }}" --title "Validación fallida $(date -u +%F)" --body "$BODY" \
            || echo "No se pudo abrir el issue (permisos del token)"
  desplegar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
